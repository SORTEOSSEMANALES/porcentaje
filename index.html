<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTEO HONDA BROS 125cc</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Fondo general con scrolling habilitado para que nada se corte */
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(135deg, #121214 0%, #1a1a24 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Permite que empiece arriba y crezca */
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-y: auto; /* Asegura el scroll vertical de la página */
        }

        /* Tarjeta principal con altura dinámica libre */
        .tarjeta-sorteo {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 60px; /* Espacio para que no choque con el botón flotante */
        }

        /* Título Honda Racing */
        h2 { 
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ff3333, #ff6666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Eslogan */
        .slogan-sorteo {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffdddd;
            margin-bottom: 12px;
            line-height: 1.4;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Subtítulo */
        .subtitulo {
            font-size: 0.8rem;
            color: #a0a0b0;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Cartel de fecha */
        .cartel-fecha {
            background: rgba(255, 170, 0, 0.1);
            border: 1px dashed rgba(255, 170, 0, 0.4);
            color: #ffcc66;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 15px 0;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .cartel-fecha.meta-alcanzada {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid #28a745;
            color: #2bed64;
        }

        /* Barra de progreso */
        .contenedor-barra {
            width: 100%;
            background-color: #262630;
            border-radius: 50px;
            margin: 10px auto 25px auto;
            overflow: hidden;
            padding: 4px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .relleno-barra {
            width: 0%;
            height: 32px;
            background: linear-gradient(90deg, #cc1111 0%, #ff3333 50%, #ff6666 100%);
            color: white;
            text-align: center;
            line-height: 32px;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 50px;
            box-shadow: 0 3px 10px rgba(255, 51, 51, 0.4);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* Lista de Precios */
        .seccion-combos {
            margin: 25px 0;
            text-align: left;
        }

        .titulo-combos {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffaa00;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }

        .lista-combos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-combo {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .item-combo.destacado {
            background: rgba(255, 51, 51, 0.08);
            border-color: rgba(255, 51, 51, 0.3);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.1);
        }

        .combo-info {
            display: flex;
            flex-direction: column;
        }

        .combo-nombre {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .combo-chances {
            font-size: 0.8rem;
            color: #a0a0b0;
            margin-top: 4px;
        }

        .combo-chances strong {
            color: #ff5555;
        }

        .item-combo.destacado .combo-chances strong {
            color: #ffaa00;
        }

        .combo-precio {
            font-size: 1.15rem;
            font-weight: 900;
            color: #ffffff;
        }

        .etiqueta-popular {
            position: absolute;
            top: 0;
            right: 0;
            background: #ffaa00;
            color: #121214;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 10px;
            border-bottom-left-radius: 8px;
            text-transform: uppercase;
        }

        /* Sección de contacto */
        .bloque-contacto {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            margin-top: 20px;
            text-align: center;
        }

        .titulo-contacto {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-contacto {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-contacto:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .cta-contacto svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .soporte-texto {
            font-size: 0.8rem;
            color: #8a8a9e;
            margin-top: 18px;
            line-height: 1.5;
        }

        .soporte-texto a {
            color: #ff5555;
            text-decoration: none;
            font-weight: 600;
        }

        /* Botón flotante */
        .btn-whatsapp {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 8px 20px rgba(37, 211, 102, 0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        
        .btn-whatsapp:hover {
            transform: scale(1.1);
        }
        
        .btn-whatsapp svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="tarjeta-sorteo">
        <h2>HONDA BROS 125cc</h2>
        <div class="slogan-sorteo">¡Acelera tu suerte y llévate una leyenda sobre dos ruedas!</div>
        
        <div class="subtitulo">PROGRESO DEL SORTEO</div>
        
        <div class="contenedor-barra">
            <div id="miBarra" class="relleno-barra">0%</div>
        </div>

        <div id="cartelSorteo" class="cartel-fecha">
            ⏳ La fecha oficial del sorteo se publicará inmediatamente al alcanzar el 90% de los números vendidos.
        </div>

        <!-- Sección de Combos (Corregidos sin barras invertidas) -->
        <div class="seccion-combos">
            <div class="titulo-combos">Lista de Precios</div>
            <div class="lista-combos">
                
                <div class="item-combo">
                    <div class="combo-info">
                        <span class="combo-nombre">Combo 1</span>
                        <span class="combo-chances">Obtienes <strong>1 chance</strong></span>
                    </div>
                    <div class="combo-precio">\$500</div>
                </div>

                <div class="item-combo">
                    <div class="combo-info">
                        <span class="combo-nombre">Combo 2</span>
                        <span class="combo-chances">Obtienes <strong>10 chances</strong></span>
                    </div>
                    <div class="combo-precio">\$3.000</div>
                </div>

                <div class="item-combo destacado">
                    <div class="etiqueta-popular">Mejor Valor</div>
                    <div class="combo-info">
