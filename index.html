<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTEO HONDA BROS 125</title>
    <style>
        :root {
            --primary: #ff4d5a;
            --dark: #0f172a;
            --light: #1e293b;
            --card-bg: #334155;
            --accent: #38bdf8;
            --success: #25d366;
            --purple: #a855f7;
            --gray: #64748b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: var(--light); padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { font-size: 14px; color: var(--primary); margin-bottom: 20px; font-weight: bold; background: #2d1f2d; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--primary); line-height: 1.4; }
        
        .datos-box { background: var(--card-bg); border: 1px solid #475569; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #475569; background: var(--dark); color: var(--text-main); border-radius: 8px; font-size: 15px; outline: none; }
        .form-input:focus { border-color: var(--accent); }

        .combo-card { background: var(--card-bg); border: 2px solid #475569; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; position: relative; }
        .combo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .combo-title { font-weight: bold; font-size: 16px; color: var(--text-main); }
        .combo-price { color: var(--primary); font-weight: bold; font-size: 18px; }
        .input-group { display: flex; align-items: center; justify-content: space-between; background: var(--dark); padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; }
        .input-group label { color: var(--text-muted); font-size: 14px; }
        .input-qty { width: 70px; padding: 6px; border: 1px solid #475569; background: var(--light); color: var(--text-main); border-radius: 6px; text-align: center; font-size: 15px; font-weight: bold; }
        
        .total-box { background: var(--dark); color: white; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; border: 1px solid #334155; }
        .total-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 15px; color: var(--text-muted); }
        .total-line span:last-child { color: var(--text-main); }
        .total-line.final { font-size: 20px; font-weight: bold; border-top: 1px solid #334155; padding-top: 8px; margin-top: 8px; color: #fff; }
        .total-line.final span:first-child { color: var(--text-main); }
        .total-line.final span:last-child { color: #51e289; }
        
        .payment-box { background: #2e1a47; border: 2px dashed var(--purple); padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .payment-title { font-weight: bold; color: #d8b4fe; font-size: 15px; margin-bottom: 8px; }
        .alias-text { background: var(--dark); border: 1px solid #4c1d95; padding: 8px; font-family: monospace; font-size: 16px; font-weight: bold; color: var(--accent); display: block; border-radius: 6px; margin-bottom: 10px; }
        .btn-copy { background: var(--purple); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-copy:hover { background: #9333ea; }
        
        .btn-contacto { display: inline-block; width: 100%; background: var(--gray); color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 15px; text-align: center; pointer-events: none; transition: background 0.3s; }
        .btn-contacto.active { background: var(--success) !important; pointer-events: auto !important; cursor: pointer !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SORTEO HONDA BROS 125</h1>
        <p class="subtitle">🔥 ¡Compartí el link con tus amigos! 🏁</p>
        
        <!-- DATOS USUARIO -->
        <div class="datos-box">
            <strong style="display:block; margin-bottom:12px; font-size:15px; color: var(--text-main);">👤 Tus Datos para la Rifa:</strong>
            <div class="form-group">
                <label for="nombre">Nombre(s):</label>
                <input type="text" id="nombre" class="form-input" placeholder="Ej: Juan Carlos" oninput="calcularTotal()">
            </div>
            <div class="form-group">
                <label for="apellido">Apellido(s):</label>
                <input type="text" id="apellido" class="form-input" placeholder="Ej: Pérez" oninput="calcularTotal()">
            </div>
            <div class="form-group">
                <label for="telefono">Número de Teléfono:</label>
                <input type="tel" id="telefono" class="form-input" placeholder="Ej: 3765123456" oninput="calcularTotal()">
            </div>
        </div>

        <!-- SELECCIÓN DE COMBOS -->
        <div class="combo-card">
            <div class="combo-header">
                <span class="combo-title">🎟️ Combo Económico</span>
                <span class="combo-price">\$500</span>
            </div>
            <div class="input-group">
                <label>Cantidad:</label>
                <input type="number" id="qty-c500" class="input-qty" min="0" value="0" oninput="calcularTotal()">
            </div>
        </div>

        <div class="combo-card">
            <div class="combo-header">
                <span class="combo-title">⭐ Combo Estándar</span>
                <span class="combo-price">\$3.000</span>
            </div>
            <div class="input-group">
                <label>Cantidad:</label>
                <input type="number" id="qty-c3000" class="input-qty" min="0" value="0" oninput="calcularTotal()">
            </div>
        </div>

        <div class="combo-card">
            <div class="combo-header">
                <span class="combo-title">🔥 Combo Premium</span>
                <span class="combo-price">\$5.000</span>
            </div>
            <div class="input-group">
                <label>Cantidad:</label>
                <input type="number" id="qty-c5000" class="input-qty" min="0" value="0" oninput="calcularTotal()">
            </div>
        </div>

        <!-- CAJA DE TOTALES -->
        <div class="total-box">
            <div class="total-line">
                <span>Combos Seleccionados:</span>
                <span id="res-combos">0</span>
            </div>
            <div class="total-line final">
                <span>Total a Pagar:</span>
                <span id="res-precio">\$0</span>
            </div>
        </div>

        <!-- PAGO Y ACCIÓN -->
        <div class="payment-box">
            <p class="payment-title">🏦 Pagá por Transferencia (Alias):</p>
            <span class="alias-text" id="alias-copiar">HONDA.BROS.SORTEO</span>
            <button class="btn-copy" onclick="copiarAlias()">📋 Copiar Alias</button>
        </div>

        <a href="#" id="btn-whatsapp" class="btn-contacto">Completar Datos Obligatorios</a>
    </div>

    <script>
        const NUMERO_TELEFONO_DESTINO = "543764901619";

        function calcularTotal() {
            const nom = document.getElementById('nombre').value.trim();
            const ape = document.getElementById('apellido').value.trim();
            const tel = document.getElementById('telefono').value.trim();

            const c500 = parseInt(document.getElementById('qty-c500').value) || 0;
            const c3000 = parseInt(document.getElementById('qty-c3000').value) || 0;
            const c5000 = parseInt(document.getElementById('qty-c5000').value) || 0;

            const totalCombos = c500 + c3000 + c5000;
            const totalDinero = (c500 * 500) + (c3000 * 3000) + (c5000 * 5000);

            document.getElementById('res-combos').innerText = totalCombos;
            document.getElementById('res-precio').innerText = "\$" + totalDinero.toLocaleString('es-AR');

            const btn = document.getElementById('btn-whatsapp');

            if(nom !== "" && ape !== "" && tel !== "" && totalDinero > 0) {
                btn.classList.add('active');
                btn.innerText = "🚀 Enviar Pedido por WhatsApp";
                
                const mensaje = `Hola! Quiero participar del sorteo.%0A%0A*Datos del participante:*%0ANombre: ${nom} ${ape}%0ATeléfono: ${tel}%0A%0A*Pedido:*%0A- Económico ($500): ${c500}%0A- Estándar ($3.000): ${c3000}%0A- Premium ($5.000): ${c5000}%0A%0A*Total a pagar:* $${totalDinero.toLocaleString('es-AR')}`;
                btn.href = `https://wa.me{NUMERO_TELEFONO_DESTINO}?text=${mensaje}`;
            } else {
                btn.classList.remove('active');
                btn.href = "#";
                if(totalDinero === 0 && nom !== "" && ape !== "" && tel !== "") {
                    btn.innerText = "Selecciona al menos 1 combo";
                } else {
                    btn.innerText = "Completar Datos Obligatorios";
                }
            }
        }

        function copiarAlias() {
