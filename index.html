<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTEO ONDA BROS 125cc</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            background-color: #f4f7f6; 
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Contenedor para centrar la celda en la pantalla */
        .contenedor-grafico {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Diseñado para que el cuadro de Google Sheets se vea limpio */
        iframe {
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h2>Progreso Total Recaudado</h2>

    <div class="contenedor-grafico">
        <!-- Mostramos la celda A4 de tu Google Sheets en vivo sin intermediarios -->
        <iframe width="250" height="120" scrolling="no" src="https://google.com"></iframe>
    </div>

    <p style="color: #666; font-size: 14px;">La barra se actualiza automáticamente con cada venta.</p>

</body>
</html>
