<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAN SORTEO HONDA BROS 125</title>
    <style>
        /* PALETA DE COLORES ULTRA MODERNA */
        :root {
            --bg-main: #090d16;
            --bg-container: #111827;
            --bg-card: #1f2937;
            --bg-input: #030712;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --accent: #38bdf8;
            --success: #22c55e;
            --purple: #a855f7;
            --gold: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        
        /* CONTENEDOR ANCHO Y RESPONSIVO */
        .container { 
            max-width: 640px; 
            width: 100%; 
            background: var(--bg-container); 
            padding: 20px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); 
            text-align: center;
            margin: 15px 0;
            border: 1px solid #1f2937;
        }
        
        @media (min-width: 480px) {
            .container { padding: 35px; }
        }

        h1 { 
            color: var(--text-main); 
            font-size: 30px; 
            font-weight: 900; 
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff4d4d, #f9fafb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .subtitle { 
            font-size: 14px; 
            color: var(--primary); 
            margin-bottom: 25px; 
            font-weight: 700; 
            background: rgba(239, 68, 68, 0.07); 
            padding: 10px 15px; 
            border-radius: 10px; 
            border: 1px dashed var(--primary); 
            display: inline-block;
        }

        /* ESTILO PARA LA IMAGEN DE LA MOTOCICLETA */
        .moto-img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            display: block;
        }
        
        /* BARRA DE PROGRESO DINÁMICA */
        .progress-section { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            padding: 18px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .progress-label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .progress-bar-container { 
            background: var(--bg-input); 
            height: 18px; 
            border-radius: 50px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
        }
        .progress-bar-fill { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--primary), var(--purple)); 
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* CUADRO DE CONDICIONES */
        .condiciones-box { 
            background: rgba(56, 189, 248, 0.05); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 16px; 
            padding: 18px; 
            margin-bottom: 25px; 
            text-align: left; 
            font-size: 13.5px; 
            line-height: 1.6; 
            color: #e5e7eb; 
        }
        .condiciones-box strong { color: var(--accent); display: block; margin-bottom: 6px; }
        .condiciones-box ul { margin-left: 20px; }
        .condiciones-box li { margin-bottom: 6px; }

        /* SECCIÓN DE DATOS */
        .datos-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 22px; 
            margin-bottom: 25px; 
            text-align: left; 
        }
        .datos-box-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: block; color: var(--text-main); }
        .form-group { margin-bottom: 15px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            background: var(--bg-input); 
            color: var(--text-main); 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.2s ease; 
        }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        /* DISEÑO DE TARJETAS DE COMBOS */
        .combo-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 16px; 
            text-align: left; 
            position: relative; 
            transition: transform 0.2s ease, border-color 0.2s ease; 
        }
        .combo-card:hover { transform: translateY(-2px); border-color: #4b5563; }
        
        /* COMBO PREMIUM MEJORADO */
        .combo-premium { 
            border: 2px solid var(--gold); 
            background: linear-gradient(145deg, #1f2937, #2e200f); 
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.1); 
        }
        .combo-premium:hover { border-color: #fbbf24; }
        .badge-premium { 
            position: absolute; 
            top: -12px; 
            right: 20px; 
            background: linear-gradient(135deg, var(--gold), #d97706); 
            color: #000; 
            font-size: 11px; 
            font-weight: 800; 
            padding: 4px 12px; 
            border-radius: 50px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
        }

        .combo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .combo-title { font-weight: 700; font-size: 18px; color: var(--text-main); }
        .combo-price { color: var(--primary); font-weight: 800; font-size: 22px; }
        .combo-premium .combo-price { color: var(--gold); }
        
        .input-group { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: var(--bg-input); 
            padding: 10px 16px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
        }
        .input-group label { color: var(--text-muted); font-size: 14px; }
        .input-qty { 
            width: 85px; 
            padding: 8px; 
            border: 1px solid var(--border); 
            background: var(--bg-card); 
            color: var(--text-main); 
            border-radius: 8px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: bold; 
            outline: none; 
        }
        .input-qty:focus { border-color: var(--accent); }
        
        /* CAJA DE TOTALES */
        .total-box { 
            background: var(--bg-input); 
            padding: 20px; 
            border-radius: 16px; 
            margin-top: 25px; 
            text-align: left; 
            border: 1px solid var(--border); 
        }
        .total-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; color: var(--text-muted); }
        .total-line span:last-child { color: var(--text-main); font-weight: 600; }
        .total-line.final { 
            font-size: 24px; 
            font-weight: 900; 
            border-top: 1px solid var(--border); 
            padding-top: 12px; 
            margin-top: 12px; 
        }
        .total-line.final span:first-child { color: var(--text-main); }
        .total-line.final span:last-child { color: var(--success); text-shadow: 0 0 15px rgba(34, 197, 94, 0.25); }
        
        /* SECCIÓN DE PAGO (ALIAS) */
        .payment-box { 
            background: rgba(168, 85, 247, 0.05); 
            border: 2px dashed var(--purple); 
            padding: 20px; 
            border-radius: 16px; 
            margin-top: 25px; 
            text-align: center; 
        }
        .payment-title { font-weight: 700; color: #c084fc; font-size: 15px; margin-bottom: 12px; }
        .alias-text { 
            background: var(--bg-input); 
            border: 1px solid rgba(168, 85, 247, 0.4); 
            padding: 12px; 
            font-family: monospace; 
            font-size: 19px; 
            font-weight: 700; 
            color: var(--accent); 
            display: block; 
            border-radius: 10px; 
            margin-bottom: 14px; 
            letter-spacing: 0.5px; 
        }
        .btn-copy { 
            background: var(--purple); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s ease; 
        }
        .btn-copy:hover { background: #9333ea; }
