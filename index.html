<script>
    // REVISE QUE ESTE ENLACE TERMINE EN output=csv
    const urlCsv = "TU_ENLACE_DE_PUBLICAR_EN_LA_WEB_AQUÍ"; 

    async function cargarProgreso() {
        try {
            const conector = urlCsv.includes("?") ? "&" : "?";
            const respuesta = await fetch(urlCsv + conector + "t=" + new Date().getTime());
            const texto = await respuesta.text();
            
            console.log("Contenido crudo de Sheets:", texto);
            
            const filas = texto.split(/\r?\n/);
            // Tomamos la fila 4 (Índice 3 es la cuarta fila del CSV)
            const fila4 = filas[3]; 
            
            if (fila4) {
                // Dividimos por coma o punto y coma automáticamente
                const columnas = fila4.split(/[,;]/); 
                let valorCelda = columnas[0].trim().replace(/"/g, "");
                
                console.log("Valor aislado de la celda A4:", valorCelda);

                // Si viene con el símbolo %, lo limpiamos y procesamos directo
                if (valorCelda.includes("%")) {
                    valorCelda = valorCelda.replace("%", "").trim();
                    let num = parseFloat(valorCelda.replace(",", ".")) || 0;
                    actualizarBarra(Math.round(num));
                    return;
                }

                // Si viene como decimal convencional (ej: 0,05 o 0.05)
                valorCelda = valorCelda.replace(",", "."); 
                let num = parseFloat(valorCelda) || 0;
                
                // Si es un decimal menor o igual a 1, representa un porcentaje de Sheets
                if (num > 0 && num <= 1) {
                    num = num * 100;
                }
                
                actualizarBarra(Math.round(num));
            } else {
                console.error("No se encontró información en la fila 4.");
            }
        } catch (e) {
            console.error("Error crítico de conexión:", e);
        }
    }

    function actualizarBarra(porcentaje) {
        if (porcentaje > 100) porcentaje = 100;
        if (porcentaje < 0) porcentaje = 0;
        
        console.log("Porcentaje final renderizado:", porcentaje + "%");
        
        const barra = document.getElementById("miBarra");
        barra.style.width = porcentaje + "%";
        barra.textContent = porcentaje + "%";
    }

    cargarProgreso();
    setInterval(cargarProgreso, 15000); 
</script>
