<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Progresiva</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 30px; }
        .progress-container { width: 90%; background-color: #333; border-radius: 25px; margin: 20px auto; overflow: hidden; max-width: 500px; }
        .progress-bar { width: 0%; height: 35px; background-color: #4CAF50; text-align: center; line-height: 35px; color: white; font-weight: bold; transition: width 1s ease-in-out; }
    </style>
</head>
<body>

    <h1>Progreso de la Rifa</h1>
    <p>¡Ayúdanos a llegar a la meta!</p>

    <!-- Barra de progreso -->
    <div class="progress-container">
        <div id="miBarra" class="progress-bar">0%</div>
    </div>

    <script>
        // 👇 AQUÍ PONES EL PORCENTAJE A MANO (Cambia el 73 por el que vayas teniendo)
        const porcentajeActual = 73; 

        // Lógica automática para pintar la barra
        const barra = document.getElementById("miBarra");
        barra.style.width = porcentajeActual + "%";
        barra.textContent = porcentajeActual + "% Vendido";
    </script>
</body>
</html>
